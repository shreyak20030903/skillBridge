# Connection details come from environment variables — never commit real values here.
# CognoDB gives you: bolt+s://<instance-id>.databases.cognodb.cloud and a password for user "cognodb".
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:cognodb}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

server.port=${PORT:8080}

# Allow the React dev server / hosted frontend to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
